name: Release PFS-BatchKit-Manager
on:
  workflow_dispatch:
  repository_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  
permissions:
  contents: write

jobs:
  Repack_and_Release:
    runs-on: ubuntu-latest
    steps:

    - name: checkout code for release
      uses: actions/checkout@v4
      
    - name: Get short SHA
      id: slug
      run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT
      
    - name: zip Folder For Release
      run: |
        SCH=${GITHUB_SHA::7}
        DATEE=`date '+[%Y-%m-%d]'`
        cd PFS-BatchKit-Manager
        cd BAT
        echo "----PFS-BatchKit-Manager----">hash.txt
        echo "Commit: $SCH">>hash.txt
        echo "Version: 1.3.0">>hash.txt
        cd ..
        cd ..
        mv PFS-BatchKit-Manager PFS-BatchKit-Manager-$DATEE
        7z a -t7z -m0=lzma2 -mx=9 -r PFS-BatchKit-Manager.7z PFS-BatchKit-Manager*/*
    
    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: PFS-BatchKit-Manager-${{ steps.slug.outputs.sha8 }}
        path: |
             PFS-BatchKit-Manager.7z

    - name: Deploy release
      uses: softprops/action-gh-release@v2
      if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
      with:
        token: "${{ secrets.GITHUB_TOKEN }}"
        fail_on_unmatched_files: true
        files: |
             PFS-BatchKit-Manager.7z
        name: "PFS-BatchKit-Manager v1.3.0 (APA-Jail exFAT + OPL Latest)"
        tag_name: "v1.3.0"
        prerelease: false

    
